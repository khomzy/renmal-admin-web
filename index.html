<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Renmal Capital Money OS administration portal.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#142633">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Renmal Money OS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Renmal Money OS</title>
  <style>
    html, body { height: 100%; margin: 0; background: #f3f5f5; font-family: system-ui, sans-serif; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f3f5f5; color: #172b3a; }
    .loading-card { text-align: center; padding: 32px; }
    .brand-mark { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px; background: #142633; color: #8fd4c5; }
    #loading strong { display: block; font-size: 23px; letter-spacing: -.5px; font-weight: 650; }
    #loading p { margin: 10px 0 24px; font-size: 14px; color: #617382; }
    .progress { width: 160px; height: 3px; margin: auto; overflow: hidden; border-radius: 4px; background: #dce7e5; }
    .progress::after { content: ''; display: block; width: 45%; height: 100%; background: #176b63; animation: load 1.5s ease-in-out infinite alternate; }
    @keyframes load { to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
    @media (prefers-color-scheme: dark) {
      html, body, #loading { background: #101c27; color: #eaf0f4; }
      #loading p { color: #a9bbc7; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="brand-mark" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9h18L12 3 3 9ZM5 11v7m5-7v7m4-7v7m5-7v7M3 21h18"/></svg></div>
      <strong>Renmal Capital</strong>
      <p>Opening your Money OS workspace…</p>
      <div class="progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
